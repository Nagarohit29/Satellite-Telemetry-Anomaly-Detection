name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check Backend/ Middleware/ --select E,F,W --ignore E501

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi pydantic pytest numpy PyYAML httpx uvicorn python-dotenv
      - run: pytest Backend/tests/ -v --tb=short

  test-middleware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi pydantic pytest httpx uvicorn python-dotenv litellm anthropic openai prometheus_client
      - run: pytest Middleware/tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-middleware]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.v2.yml config --quiet
