global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8001']
    metrics_path: /metrics

  - job_name: 'middleware'
    static_configs:
      - targets: ['middleware:8000']
    metrics_path: /metrics

  - job_name: 'triton'
    static_configs:
      - targets: ['triton:8010']
    metrics_path: /metrics
